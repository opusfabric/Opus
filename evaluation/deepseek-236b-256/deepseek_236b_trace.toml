[job]
dump_folder = "./outputs"
description = "Figure 4 DeepSeek-V2 236B GPU trace capture"
print_args = false

[profiling]
enable_profiling = true
save_traces_folder = "profile_trace"
profile_freq = 5
enable_memory_snapshot = false

[metrics]
log_freq = 1
disable_color_printing = true
enable_tensorboard = false
enable_wandb = false

[model]
name = "deepseek_v3"
flavor = "236B"
hf_assets_path = "./assets/hf/DeepSeek-V2"

[optimizer]
name = "AdamW"
lr = 2.2e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 2
decay_ratio = 0.8
decay_type = "cosine"
min_lr_factor = 0.1

[training]
# DP=8 gives a global batch of 256. PP=8 and microbatch_size=4 produce the
# eight microbatches assumed by the Figure 4 analysis.
local_batch_size = 32
seq_len = 4096
max_norm = 1.0
steps = 5
dataset = "c4_test"
enable_opus_backend = false

[parallelism]
# 8 (DP) x 8 (PP) x 4 (TP) = 256 physical GPU ranks. EP=32 borrows the
# eight DP-shard and four TP dimensions for routed-expert collectives.
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 8
fsdp_reshard_after_forward = "always"
tensor_parallel_degree = 4
enable_async_tensor_parallel = false
pipeline_parallel_degree = 8
pipeline_parallel_schedule = "1F1B"
pipeline_parallel_microbatch_size = 4
context_parallel_degree = 1
expert_parallel_degree = 32
expert_tensor_parallel_degree = 1

[checkpoint]
enable = false
folder = "checkpoint"
interval = 5
last_save_model_only = true
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false
components = []

[float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output", "router.gate"]
moe_fqns_prototype = ["experts"]

[validation]
enable = false
